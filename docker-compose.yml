services:
  reprompt:
    build: .
    ports:
      - "8741:8741"
    volumes:
      - ./models:/models:ro
    environment:
      - REPROMPT_MODEL_PATH=/models/reprompt.gguf
      - REPROMPT_GPU_LAYERS=33
    restart: unless-stopped

