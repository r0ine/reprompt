base_model: unsloth/Phi-4-mini-instruct-bnb-4bit
max_seq_length: 2048
load_in_4bit: true
dtype: null

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  use_rslora: false
  use_gradient_checkpointing: unsloth

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  warmup_steps: 5
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  weight_decay: 0.01
  seed: 3407
  logging_steps: 5
  eval_steps: 50
  save_steps: 100
  optim: paged_adamw_8bit
  bf16: false
  fp16: true
  packing: false

data:
  train: training/datasets/train.jsonl
  val: training/datasets/val.jsonl
  format: chatml

output:
  dir: training/outputs/phi-4-mini-r16
