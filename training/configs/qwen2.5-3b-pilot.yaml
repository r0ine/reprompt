base_model: Qwen/Qwen2.5-3B-Instruct
max_seq_length: 1024
load_in_4bit: true
dtype: null

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  use_rslora: false
  use_gradient_checkpointing: true

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 5
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  weight_decay: 0.01
  seed: 3407
  logging_steps: 1
  eval_steps: 10
  save_steps: 20
  optim: paged_adamw_8bit
  bf16: false
  fp16: true
  packing: false

data:
  train: training/datasets/train.jsonl
  val: training/datasets/val.jsonl
  format: chatml

output:
  dir: training/outputs/qwen2.5-3b-pilot
