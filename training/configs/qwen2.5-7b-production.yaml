base_model: unsloth/Qwen2.5-7B-Instruct-bnb-4bit
max_seq_length: 4096
load_in_4bit: true
dtype: null

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  use_rslora: true
  use_gradient_checkpointing: unsloth

training:
  num_train_epochs: 4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 100
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  weight_decay: 0.01
  seed: 3407
  logging_steps: 5
  eval_steps: 100
  save_steps: 200
  optim: paged_adamw_8bit
  bf16: false
  fp16: true
  packing: false

data:
  train: training/datasets/train.jsonl
  val: training/datasets/val.jsonl
  format: chatml

output:
  dir: training/outputs/qwen2.5-7b-production
