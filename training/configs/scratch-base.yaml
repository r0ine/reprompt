model:
  dim: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  max_seq_len: 1024
  dropout: 0.05
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true

training:
  lr: 3.0e-4
  min_lr: 1.0e-5
  warmup_steps: 500
  epochs: 3
  batch_size: 8
  grad_accum: 4
  max_grad_norm: 1.0
  save_every: 2000
  eval_every: 500
  output_dir: training/outputs/scratch

tokenizer: training/tokenizer/clarify_tok.model
