model:
  dim: 1024
  n_layers: 16
  n_heads: 16
  n_kv_heads: 4
  max_seq_len: 1024
  dropout: 0.05
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true

training:
  lr: 2.0e-4
  min_lr: 1.0e-5
  warmup_steps: 800
  epochs: 3
  batch_size: 4
  grad_accum: 8
  max_grad_norm: 1.0
  save_every: 2000
  eval_every: 500
  output_dir: training/outputs/scratch-large

tokenizer: training/tokenizer/clarify_tok.model
